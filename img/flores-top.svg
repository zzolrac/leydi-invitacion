<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d9e8"/>
      <stop offset="100%" stop-color="#d4a5c4"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c99a"/>
      <stop offset="100%" stop-color="#7aab6a"/>
    </linearGradient>
  </defs>
  <!-- Center flower -->
  <g transform="translate(300,100)">
    <circle cx="0" cy="0" r="14" fill="#c9a227"/>
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-26" rx="14" ry="20" transform="rotate(0)"/>
      <ellipse cx="-26" cy="0" rx="14" ry="20" transform="rotate(70)"/>
      <ellipse cx="26" cy="0" rx="14" ry="20" transform="rotate(-70)"/>
      <ellipse cx="0" cy="26" rx="14" ry="20" transform="rotate(140)"/>
      <ellipse cx="-25" cy="25" rx="14" ry="20" transform="rotate(-40)"/>
      <ellipse cx="25" cy="25" rx="14" ry="20" transform="rotate(40)"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#f5e6f0"/>
    <circle cx="0" cy="0" r="10" fill="#c9a227"/>
  </g>
  <!-- Left small flowers -->
  <g transform="translate(140,70)">
    <circle cx="0" cy="0" r="10" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.9">
      <ellipse cx="0" cy="-16" rx="9" ry="13"/>
      <ellipse cx="-14" cy="8" rx="9" ry="13" transform="rotate(55)"/>
      <ellipse cx="14" cy="8" rx="9" ry="13" transform="rotate(-55)"/>
    </g>
  </g>
  <g transform="translate(80,140)">
    <circle cx="0" cy="0" r="8" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.8">
      <ellipse cx="0" cy="-13" rx="7" ry="11"/>
      <ellipse cx="-12" cy="6" rx="7" ry="11" transform="rotate(55)"/>
      <ellipse cx="12" cy="6" rx="7" ry="11" transform="rotate(-55)"/>
    </g>
  </g>
  <!-- Right small flowers -->
  <g transform="translate(460,70)">
    <circle cx="0" cy="0" r="10" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.9">
      <ellipse cx="0" cy="-16" rx="9" ry="13"/>
      <ellipse cx="-14" cy="8" rx="9" ry="13" transform="rotate(55)"/>
      <ellipse cx="14" cy="8" rx="9" ry="13" transform="rotate(-55)"/>
    </g>
  </g>
  <g transform="translate(520,140)">
    <circle cx="0" cy="0" r="8" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.8">
      <ellipse cx="0" cy="-13" rx="7" ry="11"/>
      <ellipse cx="-12" cy="6" rx="7" ry="11" transform="rotate(55)"/>
      <ellipse cx="12" cy="6" rx="7" ry="11" transform="rotate(-55)"/>
    </g>
  </g>
  <!-- Leaves and vines -->
  <g fill="url(#leaf)" opacity="0.7">
    <path d="M220,60 Q240,40 260,55 Q245,70 225,65 Z"/>
    <path d="M340,60 Q320,40 300,55 Q315,70 335,65 Z"/>
    <path d="M180,110 Q200,95 210,115 Q195,125 182,118 Z"/>
    <path d="M420,110 Q400,95 390,115 Q405,125 418,118 Z"/>
    <path d="M60,80 Q80,65 95,85 Q80,95 65,88 Z"/>
    <path d="M540,80 Q520,65 505,85 Q520,95 535,88 Z"/>
  </g>
  <!-- Dots / sparkles -->
  <g fill="#c9a227" opacity="0.6">
    <circle cx="30" cy="30" r="3"/>
    <circle cx="90" cy="20" r="2.5"/>
    <circle cx="510" cy="20" r="2.5"/>
    <circle cx="570" cy="30" r="3"/>
    <circle cx="300" cy="20" r="2.5"/>
  </g>
</svg>