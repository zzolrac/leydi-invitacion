<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d9e8"/>
      <stop offset="100%" stop-color="#d4a5c4"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c99a"/>
      <stop offset="100%" stop-color="#7aab6a"/>
    </linearGradient>
  </defs>
  <!-- Left main flowers -->
  <g transform="translate(140,120)">
    <circle cx="0" cy="0" r="14" fill="#c9a227"/>
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-26" rx="14" ry="20"/>
      <ellipse cx="-26" cy="0" rx="14" ry="20" transform="rotate(70)"/>
      <ellipse cx="26" cy="0" rx="14" ry="20" transform="rotate(-70)"/>
      <ellipse cx="0" cy="26" rx="14" ry="20" transform="rotate(140)"/>
      <ellipse cx="-25" cy="25" rx="14" ry="20" transform="rotate(-40)"/>
      <ellipse cx="25" cy="25" rx="14" ry="20" transform="rotate(40)"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#f5e6f0"/>
    <circle cx="0" cy="0" r="10" fill="#c9a227"/>
  </g>
  <!-- Right main flowers -->
  <g transform="translate(460,120)">
    <circle cx="0" cy="0" r="14" fill="#c9a227"/>
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-26" rx="14" ry="20"/>
      <ellipse cx="-26" cy="0" rx="14" ry="20" transform="rotate(70)"/>
      <ellipse cx="26" cy="0" rx="14" ry="20" transform="rotate(-70)"/>
      <ellipse cx="0" cy="26" rx="14" ry="20" transform="rotate(140)"/>
      <ellipse cx="-25" cy="25" rx="14" ry="20" transform="rotate(-40)"/>
      <ellipse cx="25" cy="25" rx="14" ry="20" transform="rotate(40)"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#f5e6f0"/>
    <circle cx="0" cy="0" r="10" fill="#c9a227"/>
  </g>
  <!-- Small flowers -->
  <g transform="translate(50,60)">
    <circle cx="0" cy="0" r="8" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.85">
      <ellipse cx="0" cy="-13" rx="7" ry="11"/>
      <ellipse cx="-12" cy="6" rx="7" ry="11" transform="rotate(55)"/>
      <ellipse cx="12" cy="6" rx="7" ry="11" transform="rotate(-55)"/>
    </g>
  </g>
  <g transform="translate(550,60)">
    <circle cx="0" cy="0" r="8" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.85">
      <ellipse cx="0" cy="-13" rx="7" ry="11"/>
      <ellipse cx="-12" cy="6" rx="7" ry="11" transform="rotate(55)"/>
      <ellipse cx="12" cy="6" rx="7" ry="11" transform="rotate(-55)"/>
    </g>
  </g>
  <g transform="translate(220,50)">
    <circle cx="0" cy="0" r="6" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.75">
      <ellipse cx="0" cy="-10" rx="5.5" ry="9"/>
      <ellipse cx="-10" cy="5" rx="5.5" ry="9" transform="rotate(55)"/>
      <ellipse cx="10" cy="5" rx="5.5" ry="9" transform="rotate(-55)"/>
    </g>
  </g>
  <g transform="translate(380,50)">
    <circle cx="0" cy="0" r="6" fill="#c9a227"/>
    <g fill="url(#petal)" opacity="0.75">
      <ellipse cx="0" cy="-10" rx="5.5" ry="9"/>
      <ellipse cx="-10" cy="5" rx="5.5" ry="9" transform="rotate(55)"/>
      <ellipse cx="10" cy="5" rx="5.5" ry="9" transform="rotate(-55)"/>
    </g>
  </g>
  <!-- Leaves and vines -->
  <g fill="url(#leafB)" opacity="0.7">
    <path d="M80,140 Q100,120 120,140 Q105,150 85,145 Z"/>
    <path d="M200,140 Q215,120 235,140 Q220,150 205,145 Z"/>
    <path d="M365,140 Q385,120 400,140 Q390,150 370,145 Z"/>
    <path d="M480,140 Q500,120 520,140 Q505,150 490,145 Z"/>
    <path d="M250,50 Q265,35 275,55 Q265,62 253,56 Z"/>
    <path d="M325,50 Q340,35 355,55 Q340,62 328,56 Z"/>
  </g>
  <!-- Center monogram complement -->
  <g fill="#c9a227" opacity="0.5">
    <circle cx="300" cy="70" r="3"/>
    <circle cx="280" cy="85" r="2"/>
    <circle cx="320" cy="85" r="2"/>
    <circle cx="300" cy="95" r="2.5"/>
  </g>
</svg>