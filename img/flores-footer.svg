<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="petalF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d9e8"/>
      <stop offset="100%" stop-color="#d4a5c4"/>
    </linearGradient>
    <linearGradient id="leafF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c99a"/>
      <stop offset="100%" stop-color="#7aab6a"/>
    </linearGradient>
  </defs>
  <!-- Corner left -->
  <g transform="translate(30,60)">
    <circle cx="0" cy="0" r="12" fill="#c9a227"/>
    <g fill="url(#petalF)" opacity="0.9">
      <ellipse cx="0" cy="-22" rx="12" ry="18"/>
      <ellipse cx="-20" cy="6" rx="12" ry="18" transform="rotate(58)"/>
      <ellipse cx="20" cy="6" rx="12" ry="18" transform="rotate(-58)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#c9a227"/>
  </g>
  <!-- Corner right -->
  <g transform="translate(570,60)">
    <circle cx="0" cy="0" r="12" fill="#c9a227"/>
    <g fill="url(#petalF)" opacity="0.9">
      <ellipse cx="0" cy="-22" rx="12" ry="18"/>
      <ellipse cx="-20" cy="6" rx="12" ry="18" transform="rotate(58)"/>
      <ellipse cx="20" cy="6" rx="12" ry="18" transform="rotate(-58)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#c9a227"/>
  </g>
  <!-- Small flowers bottom -->
  <g transform="translate(180,130)">
    <circle cx="0" cy="0" r="7" fill="#c9a227"/>
    <g fill="url(#petalF)" opacity="0.8">
      <ellipse cx="0" cy="-12" rx="6" ry="10"/>
      <ellipse cx="-11" cy="6" rx="6" ry="10" transform="rotate(55)"/>
      <ellipse cx="11" cy="6" rx="6" ry="10" transform="rotate(-55)"/>
    </g>
  </g>
  <g transform="translate(420,130)">
    <circle cx="0" cy="0" r="7" fill="#c9a227"/>
    <g fill="url(#petalF)" opacity="0.8">
      <ellipse cx="0" cy="-12" rx="6" ry="10"/>
      <ellipse cx="-11" cy="6" rx="6" ry="10" transform="rotate(55)"/>
      <ellipse cx="11" cy="6" rx="6" ry="10" transform="rotate(-55)"/>
    </g>
  </g>
  <!-- Leaves and vines -->
  <g fill="url(#leafF)" opacity="0.75">
    <path d="M90,80 Q110,65 115,90 Q100,97 92,88 Z"/>
    <path d="M510,80 Q490,65 485,90 Q500,97 508,88 Z"/>
    <path d="M150,110 Q170,95 185,115 Q170,125 155,118 Z"/>
    <path d="M450,110 Q430,95 415,115 Q430,125 445,118 Z"/>
  </g>
  <!-- Dots -->
  <g fill="#c9a227" opacity="0.55">
    <circle cx="20" cy="130" r="2.5"/>
    <circle cx="580" cy="130" r="2.5"/>
    <circle cx="300" cy="150" r="3"/>
  </g>
</svg>