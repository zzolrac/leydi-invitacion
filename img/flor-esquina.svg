<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="Arreglo floral de esquina">
  <defs>
    <radialGradient id="splashA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8d7e4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e8d7e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="splashB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8d6c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c8d6c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e9d9e5" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="petalD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9c4df" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93a0bd" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="leafC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b9c7b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a9c4a9" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- watercolor splashes -->
  <circle cx="120" cy="150" r="60" fill="url(#splashA)"/>
  <circle cx="180" cy="90" r="50" fill="url(#splashB)"/>
  <circle cx="90" cy="90" r="40" fill="url(#splashA)"/>

  <!-- branch -->
  <path d="M30 240 C 90 200, 160 160, 225 55" fill="none" stroke="#7b9c7b" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M120 240 C 150 200, 180 140, 205 110" fill="none" stroke="#7b9c7b" stroke-width="2.2" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- leaves -->
  <g fill="url(#leafC)">
    <ellipse cx="60" cy="220" rx="22" ry="9" transform="rotate(-40 60 220)"/>
    <ellipse cx="90" cy="200" rx="22" ry="9" transform="rotate(-50 90 200)"/>
    <ellipse cx="130" cy="180" rx="22" ry="9" transform="rotate(-55 130 180)"/>
    <ellipse cx="165" cy="135" rx="20" ry="8" transform="rotate(-60 165 135)"/>
    <ellipse cx="95" cy="225" rx="20" ry="8" transform="rotate(-25 95 225)"/>
  </g>

  <!-- large blush flower -->
  <g transform="translate(140,130)">
    <circle cx="0" cy="0" r="22" fill="#d9c9d6"/>
    <g fill="url(#petalC)">
      <ellipse cx="0" cy="-24" rx="13" ry="22"/>
      <ellipse cx="22" cy="-8" rx="13" ry="22" transform="rotate(72)"/>
      <ellipse cx="22" cy="8" rx="13" ry="22" transform="rotate(144)"/>
      <ellipse cx="0" cy="24" rx="13" ry="22" transform="rotate(216)"/>
      <ellipse cx="-22" cy="8" rx="13" ry="22" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#c9a227"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
  </g>

  <!-- blue flower -->
  <g transform="translate(190,70)">
    <circle cx="0" cy="0" r="17" fill="#8f96ba"/>
    <g fill="url(#petalD)">
      <ellipse cx="0" cy="-18" rx="10" ry="17"/>
      <ellipse cx="17" cy="-6" rx="10" ry="17" transform="rotate(72)"/>
      <ellipse cx="17" cy="6" rx="10" ry="17" transform="rotate(144)"/>
      <ellipse cx="0" cy="18" rx="10" ry="17" transform="rotate(216)"/>
      <ellipse cx="-17" cy="6" rx="10" ry="17" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#c9a227"/>
  </g>

  <!-- small blush flower bottom -->
  <g transform="translate(95,185)">
    <circle cx="0" cy="0" r="14" fill="#e6dbe2"/>
    <g fill="url(#petalC)">
      <ellipse cx="0" cy="-15" rx="8" ry="14"/>
      <ellipse cx="14" cy="-5" rx="8" ry="14" transform="rotate(72)"/>
      <ellipse cx="14" cy="5" rx="8" ry="14" transform="rotate(144)"/>
      <ellipse cx="0" cy="15" rx="8" ry="14" transform="rotate(216)"/>
      <ellipse cx="-14" cy="5" rx="8" ry="14" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="5.5" fill="#c9a227"/>
  </g>

  <!-- buds -->
  <circle cx="70" cy="240" r="4" fill="#c9a227"/>
  <circle cx="45" cy="235" r="3" fill="#b8a45a"/>
  <circle cx="215" cy="55" r="4" fill="#c9a227"/>
  <circle cx="60" cy="205" r="3" fill="#b8a45a"/>
</svg>