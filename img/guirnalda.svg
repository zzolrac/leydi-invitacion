<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-label="Guirnalda floral">
  <defs>
    <linearGradient id="petalA1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8d7e4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="petalB2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9c4df" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9aa2c9" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="leafA2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a7d5a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#89a989" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="leafB2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b8f6b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a3bfa3" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- vine line -->
  <path d="M-10 60 C 150 80, 450 40, 610 60" fill="none" stroke="#6b7d6b" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- small leaves along vine -->
  <g fill="url(#leafA2)">
    <ellipse cx="70" cy="68" rx="14" ry="6" transform="rotate(-18 70 68)"/>
    <ellipse cx="120" cy="58" rx="13" ry="6" transform="rotate(22 120 58)"/>
    <ellipse cx="180" cy="52" rx="14" ry="6" transform="rotate(-12 180 52)"/>
    <ellipse cx="240" cy="62" rx="13" ry="6" transform="rotate(18 240 62)"/>
  </g>
  <g fill="url(#leafB2)">
    <ellipse cx="400" cy="55" rx="14" ry="6" transform="rotate(14 400 55)"/>
    <ellipse cx="460" cy="65" rx="13" ry="6" transform="rotate(-20 460 65)"/>
    <ellipse cx="520" cy="58" rx="14" ry="6" transform="rotate(12 520 58)"/>
  </g>

  <!-- flower 1 (large blush, left center) -->
  <g transform="translate(140,60)">
    <circle cx="0" cy="0" r="16" fill="#d9c9d6"/>
    <g fill="url(#petalA1)">
      <ellipse cx="0" cy="-18" rx="9" ry="16"/>
      <ellipse cx="17" cy="-6" rx="9" ry="16" transform="rotate(72)"/>
      <ellipse cx="17" cy="6" rx="9" ry="16" transform="rotate(144)"/>
      <ellipse cx="0" cy="18" rx="9" ry="16" transform="rotate(216)"/>
      <ellipse cx="-17" cy="6" rx="9" ry="16" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#c9a227"/>
  </g>

  <!-- flower 2 (small ivory, right) -->
  <g transform="translate(330,52)">
    <circle cx="0" cy="0" r="11" fill="#e6dbe2"/>
    <g fill="url(#petalA1)">
      <ellipse cx="0" cy="-13" rx="6.5" ry="11"/>
      <ellipse cx="12" cy="-4" rx="6.5" ry="11" transform="rotate(72)"/>
      <ellipse cx="12" cy="4" rx="6.5" ry="11" transform="rotate(144)"/>
      <ellipse cx="0" cy="13" rx="6.5" ry="11" transform="rotate(216)"/>
      <ellipse cx="-12" cy="4" rx="6.5" ry="11" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#c9a227"/>
  </g>

  <!-- flower 3 (blue, mid) -->
  <g transform="translate(250,72)">
    <circle cx="0" cy="0" r="12" fill="#8f96ba"/>
    <g fill="url(#petalB2)">
      <ellipse cx="0" cy="-14" rx="7" ry="12"/>
      <ellipse cx="13" cy="-4.5" rx="7" ry="12" transform="rotate(72)"/>
      <ellipse cx="13" cy="4.5" rx="7" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="14" rx="7" ry="12" transform="rotate(216)"/>
      <ellipse cx="-13" cy="4.5" rx="7" ry="12" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#c9a227"/>
  </g>

  <!-- flower 4 (small blush far left) -->
  <g transform="translate(55,58)">
    <circle cx="0" cy="0" r="10"/>
    <g fill="url(#petalA1)">
      <ellipse cx="0" cy="-12" rx="6" ry="10"/>
      <ellipse cx="11" cy="-4" rx="6" ry="10" transform="rotate(72)"/>
      <ellipse cx="11" cy="4" rx="6" ry="10" transform="rotate(144)"/>
      <ellipse cx="0" cy="12" rx="6" ry="10" transform="rotate(216)"/>
      <ellipse cx="-11" cy="4" rx="6" ry="10" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#c9a227"/>
  </g>

  <!-- flower 5 far right -->
  <g transform="translate(480,62)">
    <circle cx="0" cy="0" r="10"/>
    <g fill="url(#petalA1)">
      <ellipse cx="0" cy="-12" rx="6" ry="10"/>
      <ellipse cx="11" cy="-4" rx="6" ry="10" transform="rotate(72)"/>
      <ellipse cx="11" cy="4" rx="6" ry="10" transform="rotate(144)"/>
      <ellipse cx="0" cy="12" rx="6" ry="10" transform="rotate(216)"/>
      <ellipse cx="-11" cy="4" rx="6" ry="10" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#c9a227"/>
  </g>

  <!-- tiny bud dots -->
  <circle cx="95" cy="62" r="3" fill="#b8a45a"/>
  <circle cx="200" cy="64" r="3" fill="#b8a45a"/>
  <circle cx="300" cy="66" r="3" fill="#c9a267"/>
  <circle cx="420" cy="60" r="3" fill="#b8a45a"/>
  <circle cx="545" cy="64" r="3" fill="#b8a45a"/>
</svg>